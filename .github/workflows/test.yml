name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit and wrapper tests
        working-directory: vscode-extension
        run: npm test
      - name: Shellcheck wrapper
        if: runner.os == 'Linux'
        run: shellcheck claude-sbx
